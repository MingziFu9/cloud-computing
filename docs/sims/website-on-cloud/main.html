<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云上网站的一次访问</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
.wrap { display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:10px; }
@media (max-width:620px) { .wrap { grid-template-columns:1fr; } }
svg { width:100%; height:auto; display:block; }
.cfg label { display:flex; align-items:flex-start; gap:6px; font-size:13.5px; margin:5px 0; line-height:1.4; }
.cfg label input { margin-top:3px; }
.cfg .h { font-weight:bold; font-size:13px; color:#455a64; margin:4px 0; }
.browser { border:1px solid #b0bec5; border-radius:8px; overflow:hidden; margin-top:8px; }
.browser .bar { background:#eceff1; padding:5px 8px; font:12.5px Consolas,monospace; display:flex; gap:6px; align-items:center; }
.browser .bar .lock { font-family:sans-serif; }
.browser .page { padding:10px 12px; min-height:70px; font-size:14px; }
.page .err { color:#c62828; font-weight:bold; }
.page .code { font:12.5px Consolas,monospace; color:#607d8b; }
.page .pic { display:inline-block; width:64px; height:44px; border-radius:4px; vertical-align:middle; margin-right:8px; background:linear-gradient(135deg,#81d4fa,#4fc3f7 50%,#a5d6a7 50%,#66bb6a); }
.page .pic.broken { background:#fafafa; border:1px dashed #b0bec5; color:#90a4ae; font-size:11px; text-align:center; line-height:44px; }
</style>
</head>
<body>
<h1>云上网站的一次访问：每个环节都要配好</h1>
<div class="sub">对应 4.1.1 节搭建网站的步骤。在“配置清单”里勾选已经完成的配置，然后点“访问网站”，看请求一路经过哪些云服务、在哪里卡住、浏览器会显示什么。</div>
<div class="wrap">
  <div>
    <svg id="svg" viewBox="0 0 520 300"></svg>
    <div class="row"><button class="main" id="go">访问网站</button><button id="all">全部配好</button><button id="none">全部取消</button></div>
  </div>
  <div class="box cfg" id="cfg">
    <div class="h">配置清单</div>
  </div>
</div>
<div class="browser"><div class="bar"><span class="lock" id="lock">🌐</span><span id="url">www.mysite.com</span></div><div class="page" id="page">点“访问网站”。</div></div>
<div class="msg" id="msg"></div>
<script>
(function () {
  var ITEMS = [
    ["dns", "域名解析：www.mysite.com → 云服务器公网 IP（4.1.1.7）", true],
    ["sg", "安全组入方向放行 TCP 80、443（4.1.1.2）", false],
    ["web", "云服务器上安装并启动 Web 服务器（Nginx / Apache）（4.1.1.6）", true],
    ["code", "网站代码已上传到网站根目录（4.1.1.6）", true],
    ["db", "云数据库 RDS 已创建，代码里的地址、账号、密码正确（4.1.1.4）", true],
    ["oss", "对象存储桶已设为公共读，图片已上传（4.1.1.3）", true],
    ["ssl", "已申请 SSL 证书并在 Web 服务器上配置 HTTPS（4.1.1.7）", false]
  ];
  var cfg = document.getElementById("cfg"), svg = document.getElementById("svg"), page = document.getElementById("page"), msg = document.getElementById("msg");
  ITEMS.forEach(function (it) {
    var l = document.createElement("label");
    l.innerHTML = '<input type="checkbox" id="c_' + it[0] + '"' + (it[2] ? " checked" : "") + '><span>' + it[1] + '</span>';
    cfg.appendChild(l);
  });
  function on(k) { return document.getElementById("c_" + k).checked; }
  // 节点
  var N = {
    user: [50, 150, "用户浏览器", "#546e7a"], dns: [160, 50, "DNS 解析", "#8e24aa"],
    sg: [180, 150, "安全组", "#ef6c00"], ecs: [300, 150, "云服务器 ECS", "#1e88e5"],
    rds: [450, 90, "云数据库 RDS", "#00897b"], oss: [450, 230, "对象存储 OSS", "#6d4c41"]
  };
  function el(t, a, txt) { var e = document.createElementNS("http://www.w3.org/2000/svg", t); for (var k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; svg.appendChild(e); return e; }
  var marks = {};
  function draw() {
    svg.innerHTML = "";
    el("rect", { x: 130, y: 100, width: 380, height: 190, rx: 10, fill: "#f5f9ff", stroke: "#90caf9", "stroke-dasharray": "5 4" });
    el("text", { x: 500, y: 282, "text-anchor": "end", "font-size": 12, fill: "#1e88e5" }, "云平台（同一地域）");
    [["user", "dns"], ["user", "sg"], ["sg", "ecs"], ["ecs", "rds"], ["user", "oss"]].forEach(function (p) {
      var a = N[p[0]], b = N[p[1]];
      el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: "#cfd8dc", "stroke-width": 3 });
    });
    for (var k in N) {
      var n = N[k];
      el("rect", { x: n[0] - 44, y: n[1] - 20, width: 88, height: 40, rx: 8, fill: "#fff", stroke: n[3], "stroke-width": 2 });
      el("text", { x: n[0], y: n[1] + 5, "text-anchor": "middle", "font-size": 12.5, fill: n[3] }, n[2]);
      marks[k] = el("text", { x: n[0] + 40, y: n[1] - 16, "text-anchor": "middle", "font-size": 16 }, "");
    }
    el("text", { x: 300, y: 186, "text-anchor": "middle", "font-size": 11, fill: "#607d8b" }, "Nginx + PHP + 网站代码");
    dot = el("circle", { r: 7, fill: "#fdd835", stroke: "#f57f17", "stroke-width": 2, cx: N.user[0], cy: N.user[1], visibility: "hidden" });
  }
  var dot, busy = false;
  function move(from, to, cb) {
    var a = N[from], b = N[to], t0 = null, D = 550;
    dot.setAttribute("visibility", "visible");
    function f(ts) { if (!t0) t0 = ts; var r = Math.min(1, (ts - t0) / D);
      dot.setAttribute("cx", a[0] + (b[0] - a[0]) * r); dot.setAttribute("cy", a[1] + (b[1] - a[1]) * r);
      if (r < 1) requestAnimationFrame(f); else cb(); }
    requestAnimationFrame(f);
  }
  function mark(k, ok) { marks[k].textContent = ok ? "✔" : "✘"; marks[k].setAttribute("fill", ok ? "#2e7d32" : "#c62828"); }
  function fail(k, html, why) { mark(k, false); page.innerHTML = html; msg.innerHTML = why; dot.setAttribute("visibility", "hidden"); busy = false; }
  function chain(steps, i) { if (i < steps.length) steps[i](function () { chain(steps, i + 1); }); }
  function go() {
    if (busy) return; busy = true; draw();
    var https = on("ssl");
    document.getElementById("url").textContent = (https ? "https://" : "http://") + "www.mysite.com";
    document.getElementById("lock").textContent = https ? "🔒" : "⚠️";
    page.innerHTML = '<span class="code">正在连接……</span>'; msg.textContent = "";
    chain([
      function (n) { move("user", "dns", function () {
        if (!on("dns")) return fail("dns", '<span class="err">无法访问此网站</span><br><span class="code">DNS_PROBE_FINISHED_NXDOMAIN：找不到 www.mysite.com 的服务器 IP 地址</span>', "域名没有解析到服务器 IP，浏览器不知道该去哪里。到域名控制台添加一条 <b>A 记录</b>，指向云服务器的公网 IP。");
        mark("dns", true); move("dns", "user", n); }); },
      function (n) { move("user", "sg", function () {
        if (!on("sg")) return fail("sg", '<span class="err">无法访问此网站</span><br><span class="code">ERR_CONNECTION_TIMED_OUT：响应时间过长</span>', "请求被<b>安全组</b>挡住了，而且安全组是“静默丢弃”，所以浏览器一直等到超时。在安全组入方向添加 TCP 80（HTTPS 还要 443）、授权对象 0.0.0.0/0 的规则。");
        mark("sg", true); n(); }); },
      function (n) { move("sg", "ecs", function () {
        if (!on("web")) return fail("ecs", '<span class="err">无法访问此网站</span><br><span class="code">ERR_CONNECTION_REFUSED：www.mysite.com 拒绝了连接请求</span>', "请求已经到达服务器，但 80 端口上没有程序在监听。登录服务器执行 <code>systemctl start nginx</code>（或 apache2），并用 <code>systemctl enable</code> 设为开机自启。注意与“超时”的区别：拒绝说明安全组已经放行了。");
        if (!on("code")) return fail("ecs", '<b>Welcome to nginx!</b><br><span class="code">（Web 服务器的默认欢迎页）</span>', "Web 服务器在工作，但网站根目录里还是默认页面：代码没有上传，或者放错了目录（Ubuntu 的 Apache/Nginx 默认是 /var/www/html）。");
        mark("ecs", true); n(); }); },
      function (n) { move("ecs", "rds", function () {
        if (!on("db")) return fail("rds", '<span class="err">数据库连接错误</span><br><span class="code">mysqli::__construct(): (HY000/2002): Connection refused</span>', "网页程序连不上数据库：RDS 实例没建好、代码里的地址或密码写错，或者 RDS 的<b>白名单</b>没有加入云服务器的内网 IP。");
        mark("rds", true); move("rds", "ecs", function () { move("ecs", "user", n); }); }); },
      function (n) { move("user", "oss", function () {
        var ok = on("oss"); mark("oss", ok);
        move("oss", "user", function () {
          dot.setAttribute("visibility", "hidden"); busy = false;
          page.innerHTML = '<span class="pic' + (ok ? '' : ' broken') + '">' + (ok ? '' : '图片 403') + '</span><b>我的小站</b> · 最新文章 3 篇 · 留言 12 条';
          var tips = [];
          if (!ok) tips.push("网页出来了，但图片裂开：浏览器直接向 OSS 取图片，存储桶是<b>私有</b>的，返回 403 拒绝访问。把存储桶读权限设为“公共读”，或改用带签名的链接。");
          if (!https) tips.push("地址栏显示“不安全”：没有配置 SSL 证书，数据明文传输，登录密码可能被窃听。申请免费证书并配置 HTTPS（还要放行 443 端口）。");
          msg.innerHTML = tips.length ? tips.join("<br>") : "访问成功！一次网页访问依次用到了 <b>DNS → 安全组 → 云服务器 → 云数据库</b>，图片则由浏览器直接从 <b>对象存储</b>取回，减轻了服务器的压力。";
          n();
        });
      }); }
    ], 0);
  }
  document.getElementById("go").onclick = go;
  document.getElementById("all").onclick = function () { ITEMS.forEach(function (it) { document.getElementById("c_" + it[0]).checked = true; }); };
  document.getElementById("none").onclick = function () { ITEMS.forEach(function (it) { document.getElementById("c_" + it[0]).checked = false; }); };
  draw();
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
