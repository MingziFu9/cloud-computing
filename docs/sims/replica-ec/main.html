<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多副本与纠删码</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
.disks { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-top:8px; }
.disk { border:2px solid var(--line); border-radius:8px; padding:6px 2px; text-align:center; cursor:pointer; min-height:92px; user-select:none; }
.disk .n { font-size:11px; color:var(--muted); }
.disk.dead { background:#ffebee; border-color:var(--neg); }
.disk.dead .chip { opacity:.25; text-decoration:line-through; }
.chip { display:inline-block; margin:2px; padding:2px 6px; border-radius:4px; color:#fff; font-size:12.5px; }
.d { background:#3f51b5; } .p { background:#ef6c00; }
.calc { font-family:"JetBrains Mono",Consolas,monospace; font-size:12.5px; white-space:pre-wrap; background:#f5f7fa; border-radius:6px; padding:6px; margin-top:6px; }
</style>
</head>
<body>
<h1>多副本与纠删码：坏几块硬盘，数据还在吗？</h1>
<div class="sub">6 块硬盘，点击一块硬盘把它“弄坏”（再点一次修好）。比较两种冗余方式能扛住几块盘坏、各浪费多少空间。</div>
<div class="row"><button id="mR" class="on">三副本</button><button id="mE">纠删码 4+2</button><button id="fix">全部修好</button></div>
<div class="disks" id="disks"></div>
<div class="barrow"><span>空间利用率</span><div><div class="bar" id="bar"></div></div><span class="v" id="util"></span></div>
<div class="msg" id="msg"></div>
<div class="calc" id="calc"></div>
<script>
(function () {
  var mode = "R", dead = [false, false, false, false, false, false];
  var DATA = [3, 5, 2, 7];   // 纠删码模式下 4 个数据块的“内容”（用数字代表）
  var P1 = DATA[0] + DATA[1] + DATA[2] + DATA[3], P2 = DATA[0] + 2 * DATA[1] + 3 * DATA[2] + 4 * DATA[3];
  // 三副本：2 个数据块各存 3 份，分散到 6 块盘
  var REP = [["A"], ["B"], ["A"], ["B"], ["A"], ["B"]];
  function render() {
    var box = document.getElementById("disks"); box.innerHTML = "";
    for (var i = 0; i < 6; i++) {
      var d = document.createElement("div"); d.className = "disk" + (dead[i] ? " dead" : "");
      var chip = mode === "R" ? '<span class="chip d">数据 ' + REP[i][0] + "</span>" :
        (i < 4 ? '<span class="chip d">D' + (i + 1) + " = " + DATA[i] + "</span>" : '<span class="chip p">' + (i === 4 ? "P1 = " + P1 : "P2 = " + P2) + "</span>");
      d.innerHTML = '<div class="n">硬盘 ' + (i + 1) + (dead[i] ? " ✘" : "") + "</div>" + chip;
      (function (k) { d.onclick = function () { dead[k] = !dead[k]; render(); }; })(i);
      box.appendChild(d);
    }
    var u = mode === "R" ? 1 / 3 : 4 / 6;
    document.getElementById("bar").style.width = (u * 100) + "%";
    document.getElementById("util").textContent = (u * 100).toFixed(0) + "%";
    var nd = dead.filter(Boolean).length, msg = document.getElementById("msg"), calc = document.getElementById("calc");
    calc.textContent = "";
    if (mode === "R") {
      var lost = ["A", "B"].filter(function (x) { return REP.every(function (r, i) { return r[0] !== x || dead[i]; }); });
      if (!lost.length) { msg.textContent = "坏了 " + nd + " 块盘，数据 A、B 都至少还有 1 份，可以从幸存的副本复制回来。三副本每份数据存 3 次，空间利用率只有 33%。"; msg.className = "msg ok"; }
      else { msg.textContent = "数据 " + lost.join("、") + " 的 3 份副本全坏了，数据丢失！三副本最多保证坏任意 2 块盘不丢数据。"; msg.className = "msg bad"; }
      calc.style.display = "none";
    } else {
      calc.style.display = "block";
      var lostD = [0, 1, 2, 3].filter(function (i) { return dead[i]; }), p1 = !dead[4], p2 = !dead[5];
      var eqs = (p1 ? 1 : 0) + (p2 ? 1 : 0);
      var lines = ["校验块的算法：P1 = D1 + D2 + D3 + D4 = " + P1, "　　　　　　　P2 = D1 + 2×D2 + 3×D3 + 4×D4 = " + P2];
      if (nd === 0) { msg.textContent = "4 个数据块 + 2 个校验块。点任意 1～2 块盘把它弄坏试试。纠删码 4+2 的空间利用率是 67%，比三副本高一倍。"; msg.className = "msg"; }
      else if (lostD.length > eqs) { msg.textContent = "坏了 " + nd + " 块盘，丢了 " + lostD.length + " 个数据块，但只剩 " + eqs + " 个校验方程，解不出来，数据丢失！4+2 最多扛住任意 2 块盘损坏。"; msg.className = "msg bad"; }
      else {
        var known = function (i) { return dead[i] ? null : DATA[i]; };
        if (lostD.length === 1) {
          var k = lostD[0];
          if (p1) { var s = P1; [0, 1, 2, 3].forEach(function (i) { if (i !== k) s -= DATA[i]; }); lines.push("用 P1 解：D" + (k + 1) + " = " + P1 + " − 其他三块之和 = " + s); }
          else { var t = P2; [0, 1, 2, 3].forEach(function (i) { if (i !== k) t -= (i + 1) * DATA[i]; }); lines.push("P1 也坏了，用 P2 解：" + (k + 1) + "×D" + (k + 1) + " = " + (P2 - 0) + " − 其他项 = " + t + "，D" + (k + 1) + " = " + t / (k + 1)); }
        } else if (lostD.length === 2) {
          var a = lostD[0], b = lostD[1], S = P1, T = P2;
          [0, 1, 2, 3].forEach(function (i) { if (i !== a && i !== b) { S -= DATA[i]; T -= (i + 1) * DATA[i]; } });
          var vb = (T - (a + 1) * S) / ((b + 1) - (a + 1)), va = S - vb;
          lines.push("两个未知数，两个方程：");
          lines.push("D" + (a + 1) + " + D" + (b + 1) + " = " + S);
          lines.push((a + 1) + "×D" + (a + 1) + " + " + (b + 1) + "×D" + (b + 1) + " = " + T);
          lines.push("解得 D" + (a + 1) + " = " + va + "，D" + (b + 1) + " = " + vb);
        }
        if (dead[4] || dead[5]) lines.push("坏掉的校验块用幸存的数据块重新计算一遍即可。");
        msg.textContent = "坏了 " + nd + " 块盘，数据全部可以恢复！纠删码像解方程一样把丢失的块算回来。"; msg.className = "msg ok";
      }
      calc.textContent = lines.join("\n");
    }
    document.getElementById("mR").className = mode === "R" ? "on" : "";
    document.getElementById("mE").className = mode === "E" ? "on" : "";
  }
  document.getElementById("mR").onclick = function () { mode = "R"; render(); };
  document.getElementById("mE").onclick = function () { mode = "E"; render(); };
  document.getElementById("fix").onclick = function () { dead = dead.map(function () { return false; }); render(); };
  render();
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
