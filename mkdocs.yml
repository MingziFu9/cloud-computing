# 站点名、描述、网址和 nav 由 python tools/course.py sync 根据 course.yml 生成，请改 course.yml，不要手改这几项
site_name: 云计算及应用
site_description: 面向成人教育人工智能技术应用专业（专科）的《云计算及应用》网络教材，与国家开放大学出版社 2026 年版纸质教材配套，含交互动画、网页实验、课件和教案
site_url: https://mingzifu9.github.io/cloud-computing/
repo_url: https://github.com/MingziFu9/cloud-computing
docs_dir: docs
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - abbr
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
extra_css:
  - css/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/book.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
nav:
  - 首页: index.md
  - 课程描述: course-description.md
  - "第 1 章 云计算基础":
    - chapters/01-cloud-basics/index.md
    - "1.1 云计算概述": chapters/01-cloud-basics/1-1.md
    - "1.2 云计算的发展": chapters/01-cloud-basics/1-2.md
    - "本章实验": chapters/01-cloud-basics/labs.md
    - 本章小结与练习: chapters/01-cloud-basics/summary.md
  - "第 2 章 云计算核心技术":
    - chapters/02-core-technologies/index.md
    - "2.1 虚拟化技术": chapters/02-core-technologies/2-1.md
    - "2.2 分布式存储技术": chapters/02-core-technologies/2-2.md
    - "2.3 分布式计算技术": chapters/02-core-technologies/2-3.md
    - "2.4 云网络技术": chapters/02-core-technologies/2-4.md
    - "2.5 云安全技术": chapters/02-core-technologies/2-5.md
    - "2.6 桌面云技术": chapters/02-core-technologies/2-6.md
    - "本章实验": chapters/02-core-technologies/labs.md
    - 本章小结与练习: chapters/02-core-technologies/summary.md
  - "第 3 章 云计算平台与工具":
