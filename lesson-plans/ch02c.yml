# 第 2 章第三讲教案底稿（编者已补写完整），python tools/make_lesson_plan.py build 2c 生成 Word。
chapter: 2
part: c
online: 2
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法（交互动画）
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 掌握虚拟网络、私有网络及弹性 IP 等技术，了解 SDN 和 Overlay
  - 了解云安全技术：责任共担、常见问题与威胁
  - 掌握桌面云技术：VDI、IDV、VOI/TCI 三种架构
  skill:
  - 能够规划一个包含公网和内网子网的私有网络，正确配置安全组规则
  - 能够根据场景选择合适的桌面云架构
  quality:
  - 树立安全意识和责任意识：理解大多数云上数据泄露源于配置错误，养成最小权限、只开必要端口的习惯
  - 理解网络安全与国家安全的联系，遵守网络安全法律法规
key_points:
- 私有网络 VPC 与弹性 IP
- 云安全责任共担和常见安全问题
- 安全组规则
- 三种桌面云架构的区别
difficulties:
- point: 理解安全组规则的匹配方式（协议、端口、来源）
  solution: 用动画“安全组规则试验台”逐条添加和删除规则，观察哪些访问被放行；强调 SSH 只对自己的 IP 开放
- point: 理解 VPC 中公网子网和内网子网的分工
  solution: 用动画“VPC 拼图”拼出“网站在公网、数据库在内网”的结构
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 45
    content: 阅读 2.4 云网络技术（重点 2.4.2），完成随堂小测；操作动画“VPC 拼图”
    teacher: 发布预习任务；思考题：同一个机房里，A 公司的服务器为什么看不到 B 公司的？
    student: 阅读教材、操作动画
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播，1 学时）
  steps:
  - name: 情景导入
    minutes: 5
    content: 写字楼里的公司共用电梯和走廊，却各有门禁和分机；钱存在银行，密码还得自己保管
    teacher: 提出生活或工作中的问题，引出本次课主题
    student: 回答问题，联系自身经验
    intent: 激发兴趣，建立直觉
  - name: 讲授与演示
    minutes: 20
    content: SDN、Overlay；VPC 与弹性 IP（动画）；云安全责任共担、常见问题和威胁（结合教材案例）；安全组（动画）；三种桌面云架构（动画“三种桌面云架构”）
    teacher: 讲解，结合真实案例，现场演示动画
    student: 观察动画，分析案例中的错误配置
    intent: 突破安全组和 VPC 两个难点
  - name: 案例讨论
    minutes: 10
    content: 教材 2.5.2 中的数据泄露案例：问题出在哪里？怎样避免？
    teacher: 组织讨论，归纳“配置错误、权限过大、密码太弱”
    student: 讨论并发言
    intent: 树立安全意识
  - name: 课堂练习
    minutes: 5
    content: 课件中的课堂练习 4 题（单选、判断）
    teacher: 组织作答，讲评错因
    student: 举手或在线作答
    intent: 即时检验重点掌握情况
  - name: 小结
    minutes: 5
    content: 用第 2 章知识导图回顾全章，布置课后练习
    teacher: 带领学生回顾要点，布置课后任务
    student: 复述要点，记录任务
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 45
    content: 阅读 2.5、2.6 节（拓展阅读选读），完成随堂小测和第 2 章课后练习（在线作答 18 题）
    teacher: 批改作业，在讨论区答疑
    student: 完成练习，错题回看对应小节
    intent: 巩固全章知识
homework:
- 第 2 章课后练习：单选、多选、判断题在线作答
- 简答题：说明安全组规则“只开必要端口”的理由，并写出一台网站服务器应开放的端口
- 简答题：学校机房、移动办公、断网环境各适合哪种桌面云架构？
assessment: 线上学习进度与随堂小测（20%）、课堂练习与讨论（20%）、课后练习（30%）、实验报告（30%），计入平时成绩
reflection: ''
