# 第 4 章教案底稿（编者已补写完整），python tools/make_lesson_plan.py build 4 生成 Word。
chapter: 4
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法（交互动画）
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 了解云计算在电子政务、电商、教育、医疗、制造等行业的应用
  - 了解大数据与云计算的融合
  skill:
  - 掌握基于云环境的简单网站搭建方法，具备搭建一个简易网站的能力
  - 能用 Dockerfile 构建镜像、用 Docker Compose 部署多容器应用
  - 具备云计算应用能力
  quality:
  - 培养实践动手能力和团队互助、进取合作的意识
  - 理解政务云、信创等建设中技术发展与国家安全的联系，增强自主创新意识
key_points:
- 云上搭建网站的七个步骤
- Dockerfile 构建镜像与 Docker Compose 编排
- 政务云的三种建设模式
- 云计算与大数据的关系
difficulties:
- point: 理解多容器应用中容器之间如何协作
  solution: 实验 4-2 先单独运行网站容器（报 500 错误），再用 Docker Compose 同时启动网站和 Redis，让学生亲眼看到编排的作用
- point: 把网站的各个组成部分和云服务对应起来
  solution: 用动画“云上网站的一次访问”逐步展示请求经过 DNS、安全组、云服务器、云数据库和对象存储的过程
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 90
    content: 阅读 4.1 云计算应用案例（重点 4.1.1、4.1.3.3），完成随堂小测；操作动画“云上网站的一次访问”
    teacher: 发布预习任务；思考题：在浏览器里输入网址后，请求经过了哪些云服务？
    student: 阅读教材、操作动画
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播，1 学时）
  steps:
  - name: 情景导入
    minutes: 5
    content: 从“是什么”到“用起来”：搭一个自己的留言板网站需要哪些云服务？
    teacher: 提出生活或工作中的问题，引出本次课主题
    student: 回答问题，联系自身经验
    intent: 激发兴趣，建立直觉
  - name: 讲授与演示
    minutes: 20
    content: 建站七步（动画）；数据分析平台三步；容器部署五步，Dockerfile 与 Compose；Kubernetes 自愈（动画“Kubernetes 自愈与扩缩容”）
    teacher: 讲解，演示 docker build / run / compose 命令
    student: 观察演示，记录命令
    intent: 突破多容器协作这一难点
  - name: 讨论
    minutes: 10
    content: 政务云三种建设模式：省级、区县、敏感业务分别适合哪种？电商、教育、医疗、制造各用云解决什么问题？
    teacher: 组织分组讨论，点评
    student: 小组讨论并汇报
    intent: 理解行业应用
  - name: 课堂练习
    minutes: 5
    content: 课件中的课堂练习 3 题（单选、判断）
    teacher: 组织作答，讲评错因
    student: 举手或在线作答
    intent: 即时检验重点掌握情况
  - name: 小结
    minutes: 5
    content: 用知识导图回顾第 4 章，布置实验 4-1、4-2 和 4-3（选做）
    teacher: 带领学生回顾要点，布置课后任务
    student: 复述要点，记录任务
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 自学
    minutes: 45
    content: 阅读 4.2 云计算行业应用、4.3 云计算与大数据，完成随堂小测
    teacher: 在讨论区答疑
    student: 按“四个问题”框架整理一个行业的用云方案
    intent: 理解行业应用
  - name: 线上实验
    minutes: 90
    content: 实验 4-1 在云服务器上搭建 LAMP 留言板网站；实验 4-2 用 Dockerfile 和 Docker Compose 部署“网站 + 缓存”；实验 4-3 部署 Moodle（选做）
    teacher: 提供实验指导，线上答疑
    student: 按步骤完成实验，填写记录表
    intent: 形成在云上部署应用的能力
homework:
- 第 4 章课后练习：单选、多选、判断题在线作答
- 简答题：写出在云上搭建网站的七个步骤，并说明每一步用到的云服务
- 实验报告：实验 4-1、实验 4-2（实验 4-3 选做）
assessment: 线上学习进度与随堂小测（20%）、课堂练习与讨论（20%）、课后练习（30%）、实验报告（30%），计入平时成绩
reflection: ''
