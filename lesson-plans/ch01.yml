# 第 1 章教案底稿（编者已补写完整），python tools/make_lesson_plan.py build 1 生成 Word。
chapter: 1
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法（交互动画）
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 了解云计算的定义与特点
  - 了解云计算的历史、演进历程与发展趋势
  - 了解云计算技术主要的应用场景
  skill:
  - 掌握虚拟化、分布式计算、资源调度等核心概念
  - 掌握 IaaS、PaaS、SaaS 服务模式的基本概念
  - 掌握国内外主流云平台的对比情况
  - 能够看着一项云服务说出它属于哪种服务模式、哪种部署模式
  quality:
  - 培养求真求实意识和科学思维，用“按需取用、按量付费”的观点分析身边的信息服务
  - 了解国产云平台的发展，增强科技自信
key_points:
- 云计算的定义和五个主要特点
- IaaS、PaaS、SaaS 三种服务模式的区别
- 公有云、私有云、混合云、社区云四种部署模式
difficulties:
- point: 区分三种服务模式中用户和云服务商各自负责哪些层
  solution: 用“毛坯房、精装房、酒店”类比，再用动画“服务模式责任分层”逐层切换演示，最后做实验 1-2 对号入座
- point: 理解“资源池化”“弹性扩展”为什么能省钱
  solution: 用动画“按需付费与弹性伸缩”拖动访问量曲线，对比自建机房和弹性伸缩的费用
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 90
    content: 阅读 1.1 节（学前导读、1.1.1～1.1.5），完成 1.1 节随堂小测；操作动画“按需付费与弹性伸缩”“资源调度装箱”
    teacher: 在学习平台发布预习任务和两个思考题：你用过哪些“云”服务？自建机房和租用云服务器各有什么利弊？
    student: 阅读教材、操作动画，在讨论区回答思考题
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播，1 学时）
  steps:
  - name: 情景导入
    minutes: 5
    content: 从“用电”说起：不用自建发电厂，插上插头就有电、按电表交费；手机里的网盘、在线文档背后是什么？
    teacher: 提出生活或工作中的问题，引出本次课主题
    student: 回答问题，联系自身经验
    intent: 激发兴趣，建立直觉
  - name: 讲授与演示
    minutes: 20
    content: 云计算的定义和五个特点；三项核心技术；三种服务模式（动画“服务模式责任分层”）
    teacher: 讲解要点，现场切换 IaaS / PaaS / SaaS 演示责任分层
    student: 跟着动画判断每一层由谁负责
    intent: 突破服务模式这一难点
  - name: 讨论
    minutes: 10
    content: 四种部署模式：给医院、政务、电商、初创公司各推荐一种部署模式
    teacher: 分组布置案例，点评各组理由
    student: 小组讨论并汇报
    intent: 在情境中区分部署模式
  - name: 课堂练习
    minutes: 5
    content: 课件中的课堂练习 3 题（单选、判断）
    teacher: 组织作答，讲评错因
    student: 举手或在线作答
    intent: 即时检验重点掌握情况
  - name: 小结
    minutes: 5
    content: 用知识导图回顾第 1 章；布置实验 1-1、1-2 和 1.2 节自学
    teacher: 带领学生回顾要点，布置课后任务
    student: 复述要点，记录任务
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 自学
    minutes: 45
    content: 阅读 1.2 节云计算的发展和主流云平台比较，操作动画“云计算发展时间线”，完成 1.2 节随堂小测
    teacher: 发布自学任务，在讨论区答疑
    student: 阅读教材，整理三个发展阶段
    intent: 了解发展脉络
  - name: 线上实验
    minutes: 45
    content: 实验 1-1 注册云平台、逛控制台、算一算价格；实验 1-2 服务模式与部署模式对号入座
    teacher: 提供实验指导和记录表，线上答疑
    student: 按步骤完成实验，填写记录表
    intent: 亲眼看一看真实的云平台，巩固服务模式和部署模式
  - name: 课后巩固
    minutes: 45
    content: 完成第 1 章课后练习（在线作答 17 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告
    student: 完成练习，错题回看对应小节
    intent: 巩固知识
homework:
- 第 1 章课后练习：单选、多选、判断题在线作答
- 简答题：用自己的话说明 IaaS、PaaS、SaaS 的区别，并各举一个例子
- 实操题：用价格计算器比较按量付费和包年包月的费用
- 实验报告：实验 1-1、实验 1-2
assessment: 线上学习进度与随堂小测（20%）、课堂练习与讨论（20%）、课后练习（30%）、实验报告（30%），计入平时成绩
reflection: ''
